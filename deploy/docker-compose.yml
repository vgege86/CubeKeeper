# CubeKeeper: compose de referencia para TrueNAS SCALE 25.10 (Apps → Discover Apps → ⋮ → Install via YAML).
# Antes de instalar: parar la app de itzg (comparten puertos al usar Host Network).
services:
  cubekeeper:
    image: ghcr.io/vgege86/cubekeeper:latest
    pull_policy: always
    restart: unless-stopped

    # Host Network: necesaria para el descubrimiento LAN (UDP 7551) y NetherNet (TCP 19132 + UDP 19140).
    network_mode: host

    # Seguridad: sin privilegios, sin capacidades, sistema de archivos de solo lectura salvo /data y /tmp.
    user: "568:568"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

    # Tiempo para que BDS guarde el mundo con "stop" antes de que Docker mate el proceso.
    stop_grace_period: 90s

    environment:
      TZ: Europe/Madrid
      CUBEKEEPER_PORT: "8765"
      CUBEKEEPER_DATA: /data
      CUBEKEEPER_CHANNEL: Stable            # Stable o Preview
      # Versión de BDS fijada: se instala exactamente esta y no se actualiza sola.
      # Para pasar a otra, cámbiala aquí y pulsa «Instalar» en el panel.
      CUBEKEEPER_BDS_VERSION: 1.26.65.1
      CUBEKEEPER_ACCEPT_EULA: "true"        # https://www.minecraft.net/eula
      CUBEKEEPER_AUTOSTART: "true"
      # Copias del mundo: cada 60 min si alguien ha jugado; 24 horarias, 14 diarias y 8 semanales.
      CUBEKEEPER_BACKUP_INTERVAL_MINUTES: "60"
      CUBEKEEPER_BACKUP_KEEP_HOURLY: "24"
      CUBEKEEPER_BACKUP_KEEP_DAILY: "14"
      CUBEKEEPER_BACKUP_KEEP_WEEKLY: "8"
      CUBEKEEPER_BACKUP_SECONDARY: /backups
      # Actualización diaria (no hace nada mientras CUBEKEEPER_BDS_VERSION esté fijada).
      CUBEKEEPER_UPDATE_TIME: "05:00"
      CUBEKEEPER_UPDATE_WARN_MINUTES: "5,1"
      CUBEKEEPER_UPDATE_SKIP_IF_PLAYERS: "false"
      # Avisos al móvil con ntfy: el tema, difícil de adivinar (en ntfy.sh cualquiera que lo sepa puede leerlo).
      CUBEKEEPER_NTFY_TOPIC: "cambia-esto-por-un-tema-tuyo"
      CUBEKEEPER_PANEL_URL: https://cubekeeper.alucard86.fyi
      CUBEKEEPER_PUBLIC_HOST: 192.168.1.21  # para el enlace de la Xbox
      CUBEKEEPER_ADMIN_USER: admin
      # Solo hace falta en el primer arranque (crea el usuario). Después, bórrala.
      CUBEKEEPER_ADMIN_PASSWORD: "cambia-esta-contraseña"
      # Panel accesible solo desde casa y la VPN (además de la Access List de NPM).
      CUBEKEEPER_ALLOWED_NETWORKS: 192.168.1.0/24,10.6.0.0/24
      # De quién aceptar X-Forwarded-For: redes de Docker (NPM en bridge) y el propio NAS (NPM en host).
      CUBEKEEPER_TRUSTED_PROXIES: 172.16.0.0/12,192.168.1.21

    volumes:
      # Dataset propio (no el de itzg, /mnt/vms/minecraft): así el antiguo queda intacto para volver atrás.
      - /mnt/vms/cubekeeper:/data
      # Segundo destino de las copias del mundo, en el pool DATOS (crea antes el dataset, propiedad de 568).
      - /mnt/DATOS/backups/cubekeeper:/backups

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$$CUBEKEEPER_PORT/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 2m
      retries: 3
